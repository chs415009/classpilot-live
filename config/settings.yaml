# Thresholds and switches for the agent part.
# The env var BACKEND overrides the value below.

backend: mock          # mock | cortex

poll:
  # Defaults written into the manifest `params` at prep time; the live rule reads the manifest.
  min_responses: 5
  wrong_ratio_threshold: 0.60
  poll_answer_seconds: 60

question:
  confidence_threshold: 0.70            # responder confidence below this -> escalate
  retrieval_top_k: 3
  search_service: LESSON_SEARCH         # v1 fixture lesson; prep lessons: objects.search_service

llm:
  # Cortex AI_COMPLETE model (reached via cross-region inference from <account region>).
  # Also tested: llama3.3-70b, claude-haiku-4-5. Not used in mock mode.
  model: mistral-large3
  timeout_seconds: 10
  compiled_program: null   # id of a compiled/<id>.json program (Stage 9); null: uncompiled

parse:
  # Local conversion before upload (prep convert). LibreOffice runs in Docker only:
  # build the image with scripts/libreoffice/build.sh.
  libreoffice_image: classpilot-libreoffice:1
  libreoffice_timeout_seconds: 180
  render_scale: 2.0          # PNG at 144 dpi; lowered until the PNG fits png_max_bytes
  min_render_scale: 0.5
  png_max_bytes: 3750000     # Cortex image limit for Claude models (3.75 MB)
  alignment_min_overlap: 0.6 # share of a slide's words that must appear on its PDF page
  alignment_min_words: 3
  image_page:                # areas: fraction of the page, shared template objects removed
    image_area: 0.10         # -> image
    drawing_area: 0.30       # -> image
    unsure_image_area: 0.02  # -> unsure (unsure pages go to vision)
    unsure_drawing_area: 0.10
    min_text_chars: 10
  # Snowflake step (prep parse, BACKEND=cortex)
  vision_model: claude-haiku-4-5
  vision_max_tokens: 800
  vision_timeout_seconds: 60
  parse_timeout_seconds: 300
  chunk_max_chars: 1500      # Cortex Search: <= 512 tokens per chunk (default embedding model)

prep:
  # Generation + prep-time Guardian (prep generate / prep run). Prep runs are not traced
  # to the data model; each item's outcome is its manifest `status`.
  poll_count: 5                 # at most one poll per segment; fewer are accepted
  max_retries: 1                # retries with the Guardian's feedback, then the fallback
  malformed_retries: 1          # same call again after an unparseable reply (not timeouts)
  model: null                   # Cortex model for generation; null: llm.model (Stage 7)
  compiled_program: null        # compiled/<id>.json for the prep writers (Stage 9)
  llm_timeout_seconds: 60
  max_tokens: 1500
  retrieval_top_k: 4
  retrieval_search_k: 12        # search depth when reference chunks are required
  script_reference_chunks: 2    # at least this many reading chunks per script (examples)
  fallback_segment_slides: 3    # used only when the Segmenter fails twice
  fallback_script: "Please look at the slide on screen."

service:
  # FastAPI service (uvicorn classpilot.service.app:app). Paths relative to the repo root.
  data_dir: outputs/service     # uploads, mock tables, manifests, slide images, traces
  max_upload_mb: 100            # AI_PARSE_DOCUMENT limit per file
  cors_origins:                 # the front end's origin(s); Sai sets the real one
    - http://localhost:3000
    - http://localhost:5173

objects:
  # Parse-layer Snowflake objects (sql/04, sql/05). Role, warehouse, database, schema: .env
  raw_stage: RAW_MATERIALS
  raw_files: RAW_FILES
  parsed_pages: PARSED_PAGES
  chunks: LESSON_CHUNKS_V2
  search_service: LESSON_SEARCH_V2
