[project]
name = "classpilot-live"
version = "0.2.0.dev0"
description = "ClassPilot Live: prep service, parse layer, and live agents (LangGraph + Snowflake Cortex, mock mode for development)"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "pydantic>=2",
    "pyyaml",
    # DSPy 3.4 custom-engine API; forward()-style custom LMs are removed in 3.5.
    "dspy>=3.4.1,<3.5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Only for scripts/ and BACKEND=cortex. Tests and mock mode do not need it.
# snowflake-core = Cortex Search Python API. Do not add Snowpark or snowflake-ml-python:
# they require connector < 5.
snowflake = ["snowflake-connector-python>=5", "snowflake-core>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt text must stay byte-identical to the Stage 4 baseline, and report.py holds
# CSS/HTML strings. Both are replaced in later v2 stages (DSPy signatures, new report).
"src/classpilot/nodes/*.py" = ["E501"]
"src/classpilot/report.py" = ["E501"]
