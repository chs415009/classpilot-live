[project]
name = "classpilot-live"
version = "0.2.0.dev0"
description = "ClassPilot Live: prep service, parse layer, and live agents (LangGraph + Snowflake Cortex, mock mode for development)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "pydantic>=2",
    "pyyaml",
    # DSPy 3.4 custom-engine API; forward()-style custom LMs are removed in 3.5.
    "dspy>=3.4.1,<3.5",
    # Parse layer, local step (Stage 4). Not PyMuPDF: AGPL-3.0, and the repo is MIT.
    "python-pptx>=1.0",  # slide text and speaker notes
    "pypdfium2>=5",      # PDF text layer, page objects, PNG rendering
    "pillow>=10",        # PNG encoding and downscaling, fixture images
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Only for scripts/ and BACKEND=cortex. Tests and mock mode do not need it.
# snowflake-core = Cortex Search Python API. Do not add Snowpark or snowflake-ml-python:
# they require connector < 5.
snowflake = ["snowflake-connector-python>=5", "snowflake-core>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: list skipped tests with the reason (the LibreOffice tests skip without Docker).
addopts = "-rs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# One-off probe scripts with prompt text (Stage 1); not product code.
"scripts/probes/*.py" = ["E501"]
